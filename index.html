<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b5651d">
<title>Home Renovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#241f1a; --muted:#7a6f63; --line:#e8e1d6; --bg:#faf7f2; --card:#ffffff;
    --brand:#b5651d; --brand-dark:#8f4f16; --accent:#2f7a5e; --heart:#d1455b;
    --pill-bg:#f4ede1; --pill-text:#6b5a3f;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body { font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--bg);
    min-height:100vh; }
  svg { display:block; }

  header { position:sticky; top:0; z-index:100; background:var(--card);
    border-bottom:1px solid var(--line); padding:14px 20px 0; }
  .titlerow { display:flex; align-items:center; justify-content:space-between;
    max-width:1200px; margin:0 auto; gap:16px; }
  h1 { font-size:18px; font-weight:800; margin:0; letter-spacing:-.2px; white-space:nowrap; }
  .searchwrap { flex:1; max-width:360px; position:relative; }
  .searchwrap svg { position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--muted); }
  #search { width:100%; padding:9px 12px 9px 34px; font-size:13.5px; font-family:inherit;
    border:1.5px solid var(--line); border-radius:9px; outline:none; transition:.15s;
    background:var(--bg); }
  #search:focus { border-color:var(--brand); background:var(--card); }
  .count { font-size:12.5px; color:var(--muted); white-space:nowrap; font-weight:600; }

  nav { max-width:1200px; margin:0 auto; display:flex; gap:4px; margin-top:12px;
    overflow-x:auto; scrollbar-width:none; padding-bottom:1px; }
  nav::-webkit-scrollbar { display:none; }
  .tab { font-family:inherit; font-size:13px; font-weight:600; color:var(--muted);
    background:none; border:none; border-bottom:2.5px solid transparent; padding:9px 14px;
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;
    transition:.15s; }
  .tab:hover { color:var(--ink); background:var(--bg); border-radius:8px 8px 0 0; }
  .tab.active { color:var(--brand); border-bottom-color:var(--brand); }
  .tab svg { width:15px; height:15px; }

  main { max-width:1200px; margin:0 auto; padding:22px 20px 60px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:900px) { .grid { grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:600px) { .grid { grid-template-columns:1fr; } header{padding:12px 14px 0;}
    main{padding:16px 14px 50px;} .titlerow{flex-wrap:wrap;} h1{font-size:16px;} }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; display:flex; flex-direction:column; gap:10px; transition:.15s;
    position:relative; }
  .card:hover { box-shadow:0 6px 20px rgba(36,31,26,.08); border-color:#ddd3c3; }
  .card.seen { opacity:.52; }
  .cardtop { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .poster { font-size:12px; color:var(--muted); font-weight:600; }
  .iconbtns { display:flex; gap:6px; flex:none; }
  .iconbtn { width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s; color:var(--muted); }
  .iconbtn:hover { border-color:var(--brand); color:var(--brand); background:var(--bg); }
  .iconbtn.on.eye { color:var(--accent); border-color:var(--accent); background:#eaf5ef; }
  .iconbtn.on.heart { color:var(--heart); border-color:var(--heart); background:#fbeaed; }
  .iconbtn.on.heart svg { fill:var(--heart); }
  .iconbtn svg { width:16px; height:16px; }

  .title { font-size:14.5px; font-weight:700; line-height:1.35; margin:0; }
  .summary { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .pills { display:flex; flex-wrap:wrap; gap:5px; }
  .pill { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
    padding:3px 8px; border-radius:999px; background:var(--pill-bg); color:var(--pill-text);
    border:1px solid #e4d9c6; }

  .cardbottom { display:flex; align-items:center; justify-content:space-between;
    margin-top:auto; padding-top:6px; }
  .date { font-size:11.5px; color:var(--muted); }
  .openlink { display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700;
    color:var(--brand); text-decoration:none; padding:5px 10px; border-radius:7px;
    transition:.15s; }
  .openlink:hover { background:#f6ebdf; }
  .openlink svg { width:13px; height:13px; }

  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty svg { width:40px; height:40px; margin-bottom:10px; opacity:.5; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="titlerow">
      <h1>Home Renovation</h1>
      <div class="searchwrap">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM11 12.4a6.5 6.5 0 1 1 1.4-1.4l3.3 3.3a1 1 0 0 1-1.4 1.4L11 12.4Z"/></svg>
        <input id="search" type="text" placeholder="Search title, tag, or poster…">
      </div>
      <div class="count" id="count"></div>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM11 12.4a6.5 6.5 0 1 1 1.4-1.4l3.3 3.3a1 1 0 0 1-1.4 1.4L11 12.4Z"/></svg>
      <div>No posts match.</div>
    </div>
  </main>
</div>

<script>
const SEEN_KEY = 'renovate-seen';
const FAV_KEY = 'renovate-favs';

const CATEGORIES = [
  { key: 'all', label: 'All' },
  { key: 'wardrobe', label: 'Wardrobe' },
  { key: 'kitchen', label: 'Kitchen' },
  { key: 'bathroom', label: 'Bathroom' },
  { key: 'materials', label: 'Materials' },
  { key: 'woodwork', label: 'Woodwork' },
  { key: 'favourites', label: 'Favourites', icon: true },
];

const ICONS = {
  eyeOpen: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="2.2"/></svg>',
  eyeOff: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="2.2"/><path d="M1.5 1.5l13 13" stroke-linecap="round"/></svg>',
  heart: '<svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.3"><path d="M8 13.5S1.5 9.6 1.5 5.6C1.5 3.4 3.2 2 5 2c1.3 0 2.4.7 3 1.8C8.6 2.7 9.7 2 11 2c1.8 0 3.5 1.4 3.5 3.6 0 4-6.5 7.9-6.5 7.9Z" fill="none"/></svg>',
  open: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9.5"/><path d="M9.5 2H14v4.5"/><path d="M14 2 7 9"/></svg>',
};

let posts = [];
let seen = new Set();
let favs = new Set();
let activeTab = 'all';
let searchQuery = '';

function loadSets() {
  try { seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { seen = new Set(); }
  try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch (e) { favs = new Set(); }
}
function saveSeen() { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); }
function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = CATEGORIES.map(c => `
    <button class="tab ${activeTab === c.key ? 'active' : ''}" data-key="${c.key}">
      ${c.icon ? ICONS.heart : ''}${c.label}
    </button>
  `).join('');
  tabs.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.key; render(); });
  });
}

function matchesSearch(p, q) {
  if (!q) return true;
  const hay = [p.title, p.poster || '', ...(p.tags || [])].join(' ').toLowerCase();
  return hay.includes(q);
}

function filteredPosts() {
  const q = searchQuery.trim().toLowerCase();
  let list = posts.filter(p => matchesSearch(p, q));
  if (activeTab === 'favourites') {
    list = list.filter(p => favs.has(p.id));
  } else if (activeTab !== 'all') {
    list = list.filter(p => p.categories.includes(activeTab));
  }
  list.sort((a, b) => {
    const aSeen = seen.has(a.id), bSeen = seen.has(b.id);
    if (aSeen !== bSeen) return aSeen ? 1 : -1;
    return (b.date || '').localeCompare(a.date || '');
  });
  return list;
}

function cardHtml(p) {
  const isSeen = seen.has(p.id);
  const isFav = favs.has(p.id);
  const pills = p.categories.map(c => `<span class="pill">${c}</span>`).join('');
  return `
    <div class="card ${isSeen ? 'seen' : ''}" data-id="${p.id}">
      <div class="cardtop">
        <div class="poster">${p.poster ? '@' + p.poster : 'Unknown poster'}</div>
        <div class="iconbtns">
          <button class="iconbtn eye ${isSeen ? 'on' : ''}" data-action="seen" title="Mark seen">${isSeen ? ICONS.eyeOff : ICONS.eyeOpen}</button>
          <button class="iconbtn heart ${isFav ? 'on' : ''}" data-action="fav" title="Favourite">${ICONS.heart}</button>
        </div>
      </div>
      <p class="title">${p.title}</p>
      <p class="summary">${p.summary || ''}</p>
      <div class="pills">${pills}</div>
      <div class="cardbottom">
        <span class="date">${p.date || ''}</span>
        <a class="openlink" href="${p.url}" target="_blank" rel="noopener">${ICONS.open} Open</a>
      </div>
    </div>
  `;
}

function render() {
  renderTabs();
  const list = filteredPosts();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('count').textContent = `${list.length} post${list.length === 1 ? '' : 's'}`;
  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = list.map(cardHtml).join('');
  }
  grid.querySelectorAll('.iconbtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const id = btn.closest('.card').dataset.id;
      if (btn.dataset.action === 'seen') {
        seen.has(id) ? seen.delete(id) : seen.add(id);
        saveSeen();
      } else {
        favs.has(id) ? favs.delete(id) : favs.add(id);
        saveFavs();
      }
      render();
    });
  });
  grid.querySelectorAll('.openlink').forEach(link => {
    link.addEventListener('click', () => {
      const cardEl = link.closest('.card');
      const id = cardEl.dataset.id;
      if (!seen.has(id)) {
        seen.add(id);
        saveSeen();
        // Mark seen in place without re-sorting, so the card (and its
        // heart icon) stays put — the user needs it there when they
        // come back from Instagram to favourite it.
        cardEl.classList.add('seen');
        cardEl.querySelector('.iconbtn.eye').classList.add('on');
        cardEl.querySelector('.iconbtn.eye').innerHTML = ICONS.eyeOff;
      }
    });
  });
}

function initApp() {
  fetch('data.json?v=' + Date.now())
    .then(r => r.json())
    .then(d => {
      posts = d.posts;
      loadSets();
      render();
    });
  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    render();
  });
}

initApp();
</script>
</body>
</html>
